<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CIO Request System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .dashboard-header h1 {
            color: #333;
            font-size: 28px;
        }

        .dashboard-header p {
            color: #666;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .requests-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow-x: auto;
        }

        .requests-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        .requests-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        .requests-table tr:hover {
            background: #f8f9fa;
        }

        .control-number {
            font-weight: bold;
            color: #667eea;
        }

        .action-btn {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .action-btn-call {
            background: #28a745;
            color: white;
        }

        .action-btn-messenger {
            background: #0084ff;
            color: white;
        }

        .action-btn-print {
            background: #667eea;
            color: white;
        }

        .action-btn-delete {
            background: #dc3545;
            color: white;
        }

        .action-btn:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .status-select {
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-requests {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        @media print {
            body {
                background: white;
            }
            .dashboard-header,
            .toolbar,
            .btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1>🎯 CIO Request Management Dashboard</h1>
                <p>Manage and track all service requests</p>
            </div>
            <button class="btn btn-secondary" id="logoutBtn">Logout</button>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="loadRequests()">🔄 Refresh</button>
            <button class="btn btn-secondary" onclick="exportRequests()">📥 Export CSV</button>
        </div>

        <div class="table-wrapper">
            <table class="requests-table">
                <thead>
                    <tr>
                        <th>Control #</th>
                        <th>Date</th>
                        <th>Requesting Office</th>
                        <th>Contact Person</th>
                        <th>Phone</th>
                        <th>Messenger</th>
                        <th>Event</th>
                        <th>Event Date</th>
                        <th>Services</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <tr>
                        <td colspan="11" class="loading">Loading requests...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://jnfkfzjhgbktovvvqbuk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3Kd460W0EV6xAJuJKtCIuQ_wGtxeuM2';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let requests = [];
        let realtimeSubscription = null;

        // Check if logged in
        if (!sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'admin-login.html';
        }

        // Load requests on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadRequests();
            
            // Setup logout button
            document.getElementById('logoutBtn').addEventListener('click', function() {
                if (confirm('Logout from admin dashboard?')) {
                    sessionStorage.removeItem('adminLoggedIn');
                    window.location.href = 'admin-login.html';
                }
            });
        });

        async function loadRequests() {
            try {
                const { data, error } = await sb
                    .from('requests')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                requests = data || [];
                displayRequests();
                subscribeToRealtimeUpdates();
            } catch (error) {
                console.error('Error loading requests:', error);
                const tbody = document.getElementById('requestsTableBody');
                tbody.innerHTML = '<tr><td colspan="11" class="no-requests">Error loading requests: ' + error.message + '</td></tr>';
            }
        }

        function displayRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';

            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="no-requests">No requests yet</td></tr>';
                return;
            }

            requests.forEach((req) => {
                const row = document.createElement('tr');
                const services = Array.isArray(req.services) ? req.services.join(', ') : req.services;
                
                row.innerHTML = `
                    <td><span class="control-number">${req.control_number}</span></td>
                    <td>${new Date(req.created_at).toLocaleDateString()}</td>
                    <td>${req.requesting_office}</td>
                    <td>${req.contact_person}</td>
                    <td>${req.contact_no}</td>
                    <td>${req.messenger_name}</td>
                    <td>${req.event_activity}</td>
                    <td>${req.event_date}</td>
                    <td style="font-size: 11px;">${services}</td>
                    <td>
                        <select class="status-select" onchange="updateStatus('${req.id}', this.value)">
                            <option value="Pending" ${req.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Contacted" ${req.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                            <option value="Approved" ${req.status === 'Approved' ? 'selected' : ''}>Approved</option>
                            <option value="Declined" ${req.status === 'Declined' ? 'selected' : ''}>Declined</option>
                            <option value="Completed" ${req.status === 'Completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </td>
                    <td>
                        <button class="action-btn action-btn-call" onclick="callContact('${req.contact_no}')" title="Call">📞</button>
                        <button class="action-btn action-btn-messenger" onclick="openMessenger('${req.messenger_name}')" title="Messenger">💬</button>
                        <button class="action-btn action-btn-print" onclick="viewDetails('${req.id}')" title="View Details">👁️</button>
                        <button class="action-btn action-btn-delete" onclick="deleteRequest('${req.id}')" title="Delete">🗑️</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function subscribeToRealtimeUpdates() {
            if (realtimeSubscription) return;

            realtimeSubscription = sb
                .channel('requests-channel')
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'requests'
                }, () => {
                    loadRequests();
                })
                .subscribe();
        }

        async function updateStatus(requestId, newStatus) {
            try {
                const { error } = await sb
                    .from('requests')
                    .update({ status: newStatus })
                    .eq('id', requestId);

                if (error) throw error;
                
                await loadRequests();
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Error updating status: ' + error.message);
            }
        }

        function callContact(phoneNumber) {
            window.location.href = `tel:${phoneNumber}`;
        }

        function openMessenger(messengerName) {
            const messengerLink = messengerName.includes('facebook.com') ? messengerName : `https://m.me/${messengerName}`;
            const newWindow = window.open(messengerLink, '_blank');
            if (!newWindow) {
                navigator.clipboard.writeText(messengerName).then(() => {
                    alert(`📋 Messenger name copied to clipboard:\n${messengerName}`);
                });
            }
        }

        function viewDetails(requestId) {
            const req = requests.find(r => r.id === requestId);
            if (!req) return;

            const services = Array.isArray(req.services) ? req.services.join(', ') : req.services;
            
            alert(`📋 Request Details\n\n` +
                  `Control #: ${req.control_number}\n` +
                  `Office: ${req.requesting_office}\n` +
                  `Contact: ${req.contact_person}\n` +
                  `Phone: ${req.contact_no}\n` +
                  `Messenger: ${req.messenger_name}\n\n` +
                  `Event: ${req.event_activity}\n` +
                  `Date: ${req.event_date}\n` +
                  `Time: ${req.event_time}\n` +
                  `Venue: ${req.event_venue}\n\n` +
                  `Services: ${services}\n\n` +
                  `Status: ${req.status}`);
        }

        async function deleteRequest(requestId) {
            if (!confirm('Are you sure you want to delete this request?')) return;

            try {
                const { error } = await sb
                    .from('requests')
                    .delete()
                    .eq('id', requestId);

                if (error) throw error;

                await loadRequests();
                alert('✅ Request deleted successfully!');
            } catch (error) {
                console.error('Error deleting request:', error);
                alert('Error deleting request: ' + error.message);
            }
        }

        function exportRequests() {
            if (requests.length === 0) {
                alert('No requests to export.');
                return;
            }

            let csv = 'Control Number,Date Submitted,Requesting Office,Contact Person,Phone,Messenger,Event,Event Date,Services,Status\n';
            requests.forEach(req => {
                const services = Array.isArray(req.services) ? req.services.join('; ') : req.services;
                csv += `"${req.control_number}","${new Date(req.created_at).toLocaleDateString()}","${req.requesting_office}","${req.contact_person}","${req.contact_no}","${req.messenger_name}","${req.event_activity}","${req.event_date}","${services}","${req.status}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CIO_Requests_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
    </script>
</body>
</html>
