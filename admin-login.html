<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — CIO Request System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e1b4b 100%);
            padding: 24px;
        }

        .login-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
            margin-bottom: 18px;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
        }

        .login-header p {
            font-size: 13px;
            color: #64748b;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 44px 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        .input-wrap input:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        .eye-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .eye-toggle:hover { color: #475569; }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #dc2626;
            margin-bottom: 16px;
            display: none;
        }

        .error-box.show { display: block; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .btn-login:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79,70,229,0.35);
        }

        .btn-login:active { transform: translateY(0); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .back-link:hover { color: #334155; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="cio-logo.jpg" alt="CIO Logo" class="login-logo">
            <h1>Admin Login</h1>
            <p>City Information Office — Request Management System</p>
        </div>
        <div class="divider"></div>

        <div class="error-box" id="errorBox">
            Incorrect password. Please try again.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Enter your password" autofocus required>
                    <button type="button" class="eye-toggle" id="eyeToggle" onclick="togglePassword()">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <button class="back-link" onclick="window.location.href='index.html'">Back to public form</button>
    </div>

    <script>
        const ADMIN_PASSWORD = 'CIOBago2026';
        let passwordVisible = false;

        function togglePassword() {
            passwordVisible = !passwordVisible;
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            input.type = passwordVisible ? 'text' : 'password';
            icon.innerHTML = passwordVisible
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');

            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                errorBox.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                setTimeout(() => errorBox.classList.remove('show'), 3500);
            }
        });
    </script>
</body>
</html>
