<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Login — CIO Request System</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d111a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CIO Portal">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e1b4b 100%);
            padding: 24px;
        }

        .login-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
            margin-bottom: 18px;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
        }

        .login-header p {
            font-size: 13px;
            color: #64748b;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 44px 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px; /* prevent iOS auto-zoom */
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        .input-wrap input:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        .eye-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 8px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .eye-toggle:hover { color: #475569; }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            color: #dc2626;
            margin-bottom: 16px;
            display: none;
        }

        .error-box.show { display: block; }

        .btn-login {
            width: 100%;
            padding: 14px;
            min-height: 44px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-login:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79,70,229,0.35);
        }

        .btn-login:active { transform: translateY(0); background: #4338ca; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .back-link:hover { color: #334155; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="cio-logo.jpg" alt="CIO Logo" class="login-logo">
            <h1>Admin Login</h1>
            <p>City Information Office — Request Management System</p>
        </div>
        <div class="divider"></div>

        <div class="error-box" id="errorBox">
            Incorrect password. Please try again.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <input type="email" id="email" placeholder="your@email.com" autofocus required
                        style="padding: 11px 14px;">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="eye-toggle" id="eyeToggle" onclick="togglePassword()">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Login</button>
        </form>

        <button class="back-link" onclick="window.location.href='/'">Back to public form</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://jnfkfzjhgbktovvvqbuk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3Kd460W0EV6xAJuJKtCIuQ_wGtxeuM2';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let passwordVisible = false;

        // If already logged in, redirect to dashboard
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = '/admin-dashboard';

            // Show timeout message if redirected due to inactivity
            if (window.location.search.includes('reason=timeout')) {
                const errorBox = document.getElementById('errorBox');
                errorBox.textContent = 'Session expired due to inactivity. Please log in again.';
                errorBox.classList.add('show');
            }
        });

        function togglePassword() {
            passwordVisible = !passwordVisible;
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            input.type = passwordVisible ? 'text' : 'password';
            icon.innerHTML = passwordVisible
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const btn = document.getElementById('loginBtn');

            btn.textContent = 'Signing in...';
            btn.disabled = true;

            const { data, error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                errorBox.textContent = 'Invalid email or password. Please try again.';
                errorBox.classList.add('show');
                setTimeout(() => errorBox.classList.remove('show'), 3500);
                btn.textContent = 'Login';
                btn.disabled = false;
                return;
            }

            // Check if user has admin or superadmin role
            const role = data.user?.app_metadata?.role;
            if (role !== 'admin' && role !== 'superadmin') {
                await sb.auth.signOut();
                errorBox.textContent = 'Access denied. Your account does not have admin privileges. Please contact your Superadmin.';
                errorBox.classList.add('show');
                btn.textContent = 'Login';
                btn.disabled = false;
                return;
            }

            window.location.href = '/admin-dashboard';
        });

        // ---- SERVICE WORKER ----
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
</html>
